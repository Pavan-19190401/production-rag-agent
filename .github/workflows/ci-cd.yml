name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval-gate:
    name: Unit Tests & Eval Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Pytest)
        run: |
          pytest tests/ -v

      - name: Run Automated Evaluation Regression Gate (Subset 20)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-flash-lite-latest
        run: |
          # Fails build immediately if Recall@5 < 0.70 or Faithfulness < 0.60
          python -m eval.run_eval --retriever hybrid --subset 20 --min-recall 0.70 --min-faithfulness 0.60

      - name: Run Production Drift Monitor
        run: |
          python -m eval.drift_monitor --sample-size 20 --min-faithfulness 0.80

  build-and-package:
    name: Build Docker Images
    needs: test-and-eval-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t rag-api:${{ github.sha }} -t rag-api:latest .

      - name: Build Frontend Image
        run: |
          docker build -t rag-frontend:${{ github.sha }} -t rag-frontend:latest ./frontend

      - name: Deploy Placeholder
        run: |
          echo "Automated Continuous Deployment triggered for commit: ${{ github.sha }}"
          # Deploy triggers (e.g. Render Webhook / Google Cloud Run / Vercel CLI)
